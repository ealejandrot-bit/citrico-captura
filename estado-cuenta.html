<style>

*{box-sizing:border-box}

.wrap{max-width:680px;margin:0 auto;padding:28px 18px 130px}
.topnav{display:flex;gap:5px;background:var(--field);border-radius:12px;padding:5px;margin-bottom:20px}
.topnav a{flex:1;text-align:center;padding:10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);text-decoration:none;transition:.15s}
.topnav a.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(44,40,31,.14)}
.masthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wordmark{font-family:var(--script);font-weight:700;font-size:38px;line-height:.9;color:var(--accent)}
.tagline{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:16px;margin-top:2px}
.pill{font-size:11px;padding:5px 11px;border-radius:100px;background:var(--field);color:var(--ink2);font-weight:500;white-space:nowrap}
.panel{background:var(--surface);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(44,40,31,.04),0 12px 30px -24px rgba(44,40,31,.26)}
.lb{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:9px;font-weight:600}
.seg{display:flex;gap:5px;background:var(--field);border-radius:12px;padding:5px}
.seg button{flex:1;padding:11px;border:none;background:transparent;border-radius:9px;font-size:14.5px;font-weight:500;cursor:pointer;color:var(--ink2);font-family:var(--sans)}
.seg button.sel{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(44,40,31,.14);font-weight:600}
.drop{border:2px dashed #CDBb9c;border-radius:16px;padding:34px 18px;text-align:center;color:var(--ink2);cursor:pointer;background:var(--field);transition:.15s}
.drop:hover{border-color:var(--accent);background:var(--accent-weak)}
.drop b{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink)}
.drop small{color:var(--muted)}
.status{margin-top:14px;font-size:13.5px;color:var(--ink2)}
.sumbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
.stat{flex:1;min-width:120px;background:var(--surface);border-radius:14px;padding:13px 15px;box-shadow:0 1px 2px rgba(44,40,31,.04)}
.stat .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--serif);font-size:23px;font-weight:600;margin-top:2px}
.grouphd{font-family:var(--serif);font-size:20px;font-weight:600;margin:22px 4px 10px;display:flex;align-items:center;gap:9px}
.grouphd .tag{font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:100px}
.tag.rev{background:#F6E7DF;color:var(--red)} .tag.ok{background:var(--accent-weak);color:var(--accent-d)}
.card{background:var(--surface);border-radius:14px;padding:13px 15px;margin-bottom:9px;box-shadow:0 1px 2px rgba(44,40,31,.04);display:flex;gap:12px;align-items:flex-start;border-left:3px solid transparent}
.card.rev{border-left-color:var(--amber)} .card.tras{border-left-color:var(--rose)}
.card.off{opacity:.5}
.chk{width:22px;height:22px;flex:0 0 auto;margin-top:2px;accent-color:var(--accent);cursor:pointer}
.cbody{flex:1;min-width:0}
.crow1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cconcept{font-weight:600;font-size:14.5px;word-break:break-word}
.cmonto{font-family:var(--serif);font-size:18px;font-weight:600;white-space:nowrap;color:var(--red)}
.cmeta{font-size:12px;color:var(--muted);margin-top:2px}
.ccode{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap}
.ccode input{padding:7px 10px;border:none;border-radius:9px;background:var(--field);font-size:13px;font-family:var(--sans);width:110px}
.ccode input:focus{outline:none;box-shadow:0 0 0 1.5px var(--accent);background:#fff}
.ccode .name{font-size:12.5px;color:var(--ink2)}
.badge{font-size:10px;padding:2px 8px;border-radius:100px;font-weight:600;letter-spacing:.03em}
.badge.tras{background:#F3E7E4;color:#9A5D53}.badge.dud{background:#F7EFD9;color:#8A6A1C}
.actionbar{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(243,236,221,0),var(--bg) 42%)}
.actionbar .inner{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn-clear{padding:16px 18px;background:var(--surface);color:var(--ink2);border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans);white-space:nowrap;box-shadow:0 1px 3px rgba(44,40,31,.09)}
.btn-clear.armed{background:#F3E7E1;color:var(--red)}
.btn-main{flex:1;padding:16px;background:var(--accent);color:#F7F3E8;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans);box-shadow:0 8px 20px -8px rgba(88,97,66,.6)}
.btn-main:disabled{opacity:.5;box-shadow:none}
.linkback{display:inline-block;margin-top:14px;color:var(--accent-d);font-weight:600;font-size:13px;text-decoration:none;border-bottom:1px solid rgba(70,78,49,.3)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);padding:13px 20px;border-radius:12px;color:#F7F3E8;font-weight:500;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.22s;max-width:90%;text-align:center;box-shadow:0 14px 34px -10px rgba(0,0,0,.4)}
.toast.ok{background:var(--accent)}.toast.err{background:var(--red)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes sp{to{transform:rotate(360deg)}}

 [['redes sociales','facebook','instagram','publicidad','marketing','canva','spotify'],'601.61'],
 [['mercado pago','merpago','mercado*pago','mercadolibre','amazon'],'115.01'],
 [['uber','didi'],'601.49'],
];
function seedClassify(text){ const s=strip(text); if(!s)return null; for(const [kw,code] of FORCE){ if(s.includes(kw)) return code; } const sc={}; s.split(/[^a-z0-9]+/).forEach(t=>{ if(t.length<2)return; if(SEED[t])sc[SEED[t]]=(sc[SEED[t]]||0)+3; else if(KWDICT[t])sc[KWDICT[t]]=(sc[KWDICT[t]]||0)+1; }); let b=null,bv=0; for(const k in sc){if(sc[k]>bv){bv=sc[k];b=k;}} return b; }
function cleanConcept(desc){ const d0=desc[0]||""; let m=d0.match(/COMPRA-DISPOSICION \(POS\)\s*\d{2}\w{3}\d{4}\s*(.*)/i); if(m) return m[1].replace(/\s*\d{6,}.*/,'').trim()||d0; if(/^ENV[IÍ]O SPEI/i.test(d0)) return d0.split(':').slice(1).join(':').trim(); return d0.trim(); }
function classifyBank(desc){
  const full=desc.join(' '), s=strip(full), concept=cleanConcept(desc);
  if(s.includes('traspaso de recursos')) return {code:'102.01',clase:'Traspaso',conf:'Revisar',nota:'No es gasto: dinero movido a otra de tus cuentas'};
  if(s.includes('pago a interes')||(s.includes('pago')&&s.includes('credito'))) return {code:'701.11',clase:'Gasto',conf:'Revisar',nota:'Pago de crédito: separar interés (gasto) vs capital (pasivo)'};
  if(s.includes('comision')) return {code:'701.10',clase:'Gasto',conf:'Directo',nota:''};
  for(const [keys,code] of MERCH){ if(keys.some(k=>s.includes(k))) return {code,clase:'Gasto',conf:'Directo',nota:''}; }
  const c=seedClassify(concept); if(c) return {code:c,clase:'Gasto',conf:'Auto',nota:''};
  return {code:'',clase:'Gasto',conf:'Revisar',nota:'No reconocido — clasifícalo'};
}

/* ---------- PDF parser ---------- */
async function parsePDFlines(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const tc=await page.getTextContent();
    const rowsMap={};
    tc.items.forEach(it=>{ if(!it.str) return; const y=Math.round(it.transform[5]); (rowsMap[y]=rowsMap[y]||[]).push([it.transform[4],it.str]); });
    Object.keys(rowsMap).map(Number).sort((a,b)=>b-a).forEach(y=>{ const parts=rowsMap[y].sort((a,b)=>a[0]-b[0]).map(a=>a[1]); lines.push(parts.join(' ').replace(/\s+/g,' ').trim()); });
  }
  return lines;
}
const SKIP=['CONTINUA EN LA SIGUIENTE','PAGINA ','ESTADO DE CUENTA','NUMERO DE CLIENTE','R.F.C.','BANCO DEL BAJIO','CONDUSEF','REPRODUCCION','PARA CONSULTA'];
function extractGastos(lines){
  const startRe=/^\s*(\d{1,2})\s+(ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEP|OCT|NOV|DIC)\b/;
  const amtRe=/\$\s*(-?[\d,]+\.\d{2})/g;
  let year=((lines.join(' ').match(/DE\s+(20\d{2})/))||[])[1]||String(new Date().getFullYear());
  let acct=((lines.join(' ').match(/NUMERO DE CLIENTE:?\s*(\d{6,})/i))||[])[1]||'';
  let prev=null;
  for(const ln of lines){ if(/SALDO INICIAL/i.test(ln)){ const a=[...ln.matchAll(amtRe)]; if(a.length){prev=num(a[a.length-1][1]);break;} } }
  let movs=[],cur=null; const flush=()=>{ if(cur)movs.push(cur); cur=null; };
  for(const ln of lines){
    const m=ln.match(startRe);
    if(m){ flush(); const found=[...ln.matchAll(amtRe)];
      let head = found.length? ln.slice(m[0].length, found[0].index) : ln.slice(m[0].length);
      head=head.replace(/^\s*\d{4,}\s*/,'').trim();
      const saldo=found.length?num(found[found.length-1][1]):null;
      const rm=ln.slice(m[0].length).match(/^\s*(\d{4,})/); const ref=rm?rm[1]:'';
      cur={mes:m[2],dia:+m[1],saldo,ref,acct,desc:head?[head]:[]};
    } else if(cur){ const t=ln.trim(); if(!t||SKIP.some(s=>t.includes(s))||t.indexOf('FECHA')===0) continue; cur.desc.push(t); }
  }
  flush();
  const out=[];
  for(const mv of movs){ if(mv.saldo==null) continue; const delta=Math.round((mv.saldo-prev)*100)/100; prev=mv.saldo; if(delta<0){ mv.tipo='gasto'; mv.monto=Math.abs(delta); mv.year=year; out.push(mv); } }
  return out;
}
/* ---------- Excel parser (best-effort) ---------- */
function extractGastosExcel(rows){
  // find header
  let hi=-1,cols={};
  for(let i=0;i<Math.min(rows.length,15);i++){ const r=rows[i].map(x=>strip(String(x||''))); const j=k=>r.findIndex(c=>c.includes(k));
    if(j('fecha')>=0 && (j('cargo')>=0||j('retiro')>=0||j('saldo')>=0)){ hi=i; cols={fecha:j('fecha'),desc:Math.max(j('concepto'),j('descrip')),cargo:Math.max(j('cargo'),j('retiro')),abono:Math.max(j('abono'),j('deposito'),j('deposito')),saldo:j('saldo')}; break; } }
  if(hi<0) return [];
  const out=[]; let prev=null;
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i]; if(!r||!r.length) continue;
    const saldo = cols.saldo>=0 ? num(r[cols.saldo]) : null;
    const cargo = cols.cargo>=0 ? num(r[cols.cargo]) : 0;
    let monto=0, isGasto=false;
    if(saldo!=null && prev!=null){ const d=Math.round((saldo-prev)*100)/100; if(d<0){monto=Math.abs(d);isGasto=true;} } 
    else if(cargo>0){ monto=cargo; isGasto=true; }
    if(saldo!=null) prev=saldo;
    if(isGasto && monto>0){ const desc=[String(r[cols.desc]||'').trim()]; out.push({desc,monto,year:String(new Date().getFullYear()),mes:'ENE',dia:1,fromExcel:true,fechaRaw:r[cols.fecha]}); }
  }
  return out;
}

$("drop").addEventListener("click",()=>$("file").click());
["dragover","dragenter"].forEach(e=>$("drop").addEventListener(e,ev=>{ev.preventDefault();$("drop").style.borderColor="#586142";}));
$("drop").addEventListener("drop",ev=>{ev.preventDefault(); if(ev.dataTransfer.files[0]) handleFile(ev.dataTransfer.files[0]);});

async function handleFile(file){
  if(!SUCURSAL){ toast("Primero elige la sucursal.",false); return; }
  $("status").innerHTML='<span class="spin" style="border-top-color:#586142;border-color:rgba(88,97,66,.3);border-top-color:#586142"></span>Leyendo '+file.name+'...';
  try{
    let raw=[];
    if(/\.pdf$/i.test(file.name)){ const lines=await parsePDFlines(file); raw=extractGastos(lines); }
    else{ const data=await file.arrayBuffer(); const wb=XLSX.read(data,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{header:1}); raw=extractGastosExcel(rows); }
    if(!raw.length){ $("status").textContent="No pude detectar movimientos de gasto en el archivo. ¿Es el estado de cuenta correcto?"; return; }
    ITEMS=raw.map((mv,i)=>{ const cl=classifyBank(mv.desc); const [g,e]=grpEst(cl.code); return {
      idx:i, fecha:`${mv.dia} ${mv.mes}`, dia:mv.dia, mes:mv.mes, year:mv.year, monto:mv.monto, raw:mv.desc.join(' '),
      concepto:cleanConcept(mv.desc), code:cl.code, cuenta:(CODEMAP[cl.code]||{}).name||'', grupo:g, estado:e,
      clase:cl.clase, conf:cl.conf, nota:cl.nota, ref:mv.ref||'', acct:mv.acct||'',
      include: cl.clase==='Gasto' && !!cl.code
    }; });
    render();
  }catch(err){ $("status").textContent="Error leyendo el archivo: "+err.message; }
}

function isDudoso(it){ return it.conf==='Revisar' || it.clase==='Traspaso' || !it.code; }

function render(){
  $("status").textContent="";
  const dud=ITEMS.filter(isDudoso), ok=ITEMS.filter(it=>!isDudoso(it));
  const totalG=ITEMS.filter(it=>it.clase==='Gasto').reduce((a,b)=>a+b.monto,0);
  $("summary").innerHTML=`<div class="sumbar">
    <div class="stat"><div class="k">Gastos detectados</div><div class="v">${ITEMS.filter(it=>it.clase==='Gasto').length}</div></div>
    <div class="stat"><div class="k">Suma</div><div class="v">$${totalG.toLocaleString('es-MX',{minimumFractionDigits:2})}</div></div>
    <div class="stat"><div class="k">Para revisar</div><div class="v">${dud.length}</div></div>
  </div>`;
  let html="";
  if(dud.length){ html+=`<div class="grouphd">Revisar primero <span class="tag rev">${dud.length}</span></div>`; dud.forEach(it=>html+=card(it)); }
  if(ok.length){ html+=`<div class="grouphd">Clasificados <span class="tag ok">${ok.length}</span></div>`; ok.forEach(it=>html+=card(it)); }
  $("results").innerHTML=html;
  ITEMS.forEach(it=>{
    const chk=$("chk"+it.idx); if(chk) chk.addEventListener("change",()=>{ it.include=chk.checked; $("card"+it.idx).classList.toggle("off",!chk.checked); updateBar(); });
    const inp=$("code"+it.idx); if(inp) inp.addEventListener("change",()=>{ const v=inp.value.trim(); const c=CODEMAP[v]; if(c){ it.code=v; it.cuenta=c.name; const [g,e]=grpEst(v); it.grupo=g; it.estado=e; $("nm"+it.idx).textContent=c.name; } else { $("nm"+it.idx).textContent="código no válido"; } });
  });
  $("actionbar").style.display="block"; updateBar();
}
function card(it){
  const cls="card "+(it.clase==='Traspaso'?'tras':(isDudoso(it)?'rev':''))+(it.include?'':' off');
  const badge = it.clase==='Traspaso'?'<span class="badge tras">traspaso · no es gasto</span>':(isDudoso(it)?'<span class="badge dud">revisar</span>':'');
  return `<div class="card ${it.include?'':'off'}" id="card${it.idx}" style="${it.clase==='Traspaso'?'border-left-color:var(--rose)':(isDudoso(it)?'border-left-color:var(--amber)':'')}">
    <input type="checkbox" class="chk" id="chk${it.idx}" ${it.include?'checked':''}>
    <div class="cbody">
      <div class="crow1"><div class="cconcept">${it.concepto||'(sin concepto)'} ${badge}</div><div class="cmonto">$${it.monto.toLocaleString('es-MX',{minimumFractionDigits:2})}</div></div>
      <div class="cmeta">${it.fecha} · ${it.year}${it.nota?' · '+it.nota:''}</div>
      <div class="ccode"><input id="code${it.idx}" value="${it.code}" list="codes" placeholder="código"><span class="name" id="nm${it.idx}">${it.cuenta||'—'}</span></div>
    </div></div>`;
}
function updateBar(){ const sel=ITEMS.filter(it=>it.include&&it.code); const sum=sel.reduce((a,b)=>a+b.monto,0); $("accept").disabled=!sel.length; $("accept").textContent=`Aceptar e ingresar  ·  ${sel.length}  ·  $${sum.toLocaleString('es-MX',{minimumFractionDigits:2})}`; }

/* datalist */
(function(){ const dl=document.createElement('datalist'); dl.id='codes'; dl.innerHTML=CAT.map(c=>`<option value="${c.code}">${c.name}</option>`).join(''); document.body.appendChild(dl); })();

/* ---------- send ---------- */
$("accept").addEventListener("click",send);
function send(){
  const sel=ITEMS.filter(it=>it.include&&it.code);
  if(!sel.length) return;
  const records=sel.map(it=>{
    const mn=MESN[it.mes]||1; const fecha=`${it.year}-${String(mn).padStart(2,'0')}-${String(it.dia).padStart(2,'0')}`;
    const pos = /compra-disposicion|pos/i.test(it.raw||it.concepto)?'debcre':'transf';
    const isTras = it.clase==='Traspaso';
    const rec={ fecha, anio:+it.year, mes:MESNOM[mn-1], dia:it.dia, mes_n:mn,
      sucursal:SUCURSAL, fuente:'Estado de cuenta BanBajío', tipo_movimiento:isTras?'Traspaso':'Gasto',
      codigo_sat:it.code, cuenta_sat:it.cuenta, grupo:it.grupo, estado_financiero:it.estado,
      producto:it.concepto, proveedor:it.concepto,
      efectivo:0, debito_credito: pos==='debcre'?it.monto:0, tpv:0, amex:0, transferencia: pos==='transf'?it.monto:0,
      total:it.monto, flujo: isTras?0:-it.monto,
      folio_factura:'', notas:('BanBajío · cliente '+(it.acct||'?')+' · ref '+(it.ref||'-')+' · '+it.dia+' '+it.mes+' '+it.year), real_banbajio:0, pagado:'Sí', observaciones:'', capturado_por:'Importación banco' };
    return rec;
  });
  $("accept").disabled=true; $("accept").innerHTML='<span class="spin"></span>Enviando '+records.length+'...';
  const payload={records, foto:null};
  const ok=()=>{ toast('✓ '+records.length+' gastos ingresados a tu hoja',true); sel.forEach(it=>{ it.include=false; const c=$("card"+it.idx); if(c){c.style.display='none';} }); updateBar(); $("accept").disabled=false; };
  const err=()=>{ toast('No se pudo ingresar. Revisa la conexión.',false); $("accept").disabled=false; updateBar(); };
  if(window.google&&google.script&&google.script.run){ google.script.run.withSuccessHandler(ok).withFailureHandler(err).saveRecords(payload); }
  else{ fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(ok).catch(err); }
}
